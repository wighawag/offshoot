<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="offshoot">
	<title>offshoot</title>
	<rect width="64" height="64" rx="14" fill="#0E211A" />
	<!-- the template branch: a stem of successive snapshots -->
	<path d="M21 54 V 13" stroke="#F8FAFC" stroke-width="3.4" stroke-linecap="round" fill="none" />
	<circle cx="21" cy="54" r="3.4" fill="#F8FAFC" />
	<circle cx="21" cy="13" r="3.4" fill="#F8FAFC" />
	<!-- the offshoot: your project, branching away and growing on its own -->
	<path d="M21 41 C 21 31, 27 26, 35 24" stroke="#4ADE80" stroke-width="3.4" stroke-linecap="round" fill="none" />
	<!-- leaf, pointed at both ends, with the midrib cut out of it -->
	<path d="M34 25 C 39 16, 46 11, 53 11 C 53 18, 48 27, 34 25 Z" fill="#4ADE80" />
	<path d="M36 24.6 C 42 20, 48 16, 52 12" stroke="#0E211A" stroke-width="1.6" stroke-linecap="round" fill="none" />
	<!-- the branch point, where the two meet -->
	<circle cx="21" cy="41" r="4.6" fill="#4ADE80" />
	<circle cx="21" cy="41" r="1.9" fill="#0E211A" />
</svg>
